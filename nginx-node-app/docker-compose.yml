# Deployable as a stack (Dockhand, Dockge, Portainer, or plain `docker compose up`).
# Build contexts are relative, so point the stack manager at this directory
# (or the repo subpath nginx-node-app/) and it can build both images.
# No container_name / no host paths — stack managers name and place containers.
services:
  app:
    build: ./app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/usr/src/app/data
    volumes:
      - tally-data:/usr/src/app/data
    # Not published to the host — only reachable through nginx on the
    # internal network. Uncomment to hit the app directly while debugging.
    # ports:
    #   - "3000:3000"
    networks:
      - webnet

  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - app
    networks:
      - webnet

volumes:
  tally-data:

networks:
  webnet:
    driver: bridge
